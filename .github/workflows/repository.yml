name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    name: Bootstrap safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_repository.py
